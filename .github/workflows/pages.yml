name: Publish Cloud Migration documentation portal

# Keep the committed main-branch Pages source current whenever documentation or site assets change.
on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.MD"
      - "**/*.pdf"
      - "**/*.vsdx"
      - "docs/images/**"
      - "docs-manifest.json"
      - ".nojekyll"
      - "site/**"
      - ".github/workflows/pages.yml"
      - "scripts/Generate-DocsManifest.ps1"
      - "scripts/Build-DocsSite.ps1"
      - "scripts/Publish-DocsSiteToBranch.ps1"
      - "scripts/Test-DocsSite.ps1"
  workflow_dispatch:
  # Safety net for occasional missed push events; the latest main is republished automatically.
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types:
      - stage-snapshot

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  documentation-portal-gate:
    name: Documentation Portal Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      - name: Evaluate IS_ORIGIN
        id: gate
        shell: bash
        env:
          IS_ORIGIN: ${{ vars.IS_ORIGIN }}
        run: |
          set -euo pipefail

          if [[ "${IS_ORIGIN,,}" == "true" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal workflow is enabled for the origin repository."
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "Documentation portal workflow is disabled for the mirror repository."
          fi

  sync-branch-source:
    needs: documentation-portal-gate
    name: Synchronize GitHub Pages branch source
    if: needs['documentation-portal-gate'].outputs.enabled == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Publish branch source
        shell: pwsh
        run: ./scripts/Publish-DocsSiteToBranch.ps1

      - name: Commit updated branch source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .nojekyll index.html styles.css site.js search-index.json docs
          if git diff --cached --quiet; then
            echo "Branch Pages source is already current."
          else
            git commit -m "Synchronize GitHub Pages branch source"
            git push
          fi
